# The suite's Worker. docs/specs/cloudflare-migration.md; going live is docs/ops/EDGE_FRONT_DOOR.md.
#
# A route only takes traffic for a hostname whose DNS record is proxied (orange cloud), so deploying this changes
# nothing for app, docs or mcpdocs while their records are DNS only. edge.freeflow.im is the rehearsal host.
name = "freeflow-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "edge.freeflow.im", custom_domain = true },
  { pattern = "app.freeflow.im/*", zone_name = "freeflow.im" },
  { pattern = "docs.freeflow.im/*", zone_name = "freeflow.im" },
  { pattern = "mcpdocs.freeflow.im/*", zone_name = "freeflow.im" },
]

# The built-in help (docs/help, and What's New from changelog/) bundled into src/help/bundle.generated.ts; runs before
# `wrangler dev` and `wrangler deploy`.
[build]
command = "node scripts/help.mjs"
watch_dir = ["../../docs/help", "../../changelog"]

# scripts/assemble.mjs fills public/: the built files of both clients, never their pages.
# The Worker runs first so that it alone decides what a path is; a miss comes back to it and goes to the origin.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Secrets, set with `wrangler secret put`: EDGE_ORIGIN_SECRET (the same value as /flow/EDGE_ORIGIN_SECRET on the instance),
# EMAIL_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_ID, APPLE_AUDIENCE; GOOGLE_CLIENT_SECRET (the same Google client's,
# for Google Calendar's OAuth: src/calendar/google.ts; unset, Google Calendar is off). GOOGLE_REDIRECT_URL (a var) only in
# local dev, where the callback is not the Worker's own origin.
# Pushes (src/org/push): FLOW_PUSH_DRIVER=apns with the secrets FLOW_APNS_KEY (base64 of the .p8), FLOW_APNS_KEY_ID and
# FLOW_APNS_TEAM_ID, the values in /flow/ on AWS; FLOW_APNS_ENV and FLOW_APNS_TOPIC are optional. Without them the dev
# driver logs each push and Apple is never called. Huddles: LIVEKIT_API_KEY, LIVEKIT_API_SECRET and LIVEKIT_URL (/flow/
# too); all three turn huddles on in /v1/config, and LiveKit's webhook comes to /v1/livekit/webhook.
# Domains (src/directory/dns.ts, providers/cloudflareDns.ts): CLOUDFLARE_DNS_TOKEN (DNS edit on freeflow.im) and
# CLOUDFLARE_DNS_ZONE_ID write each organization's <slug>.freeflow.im records; without them the dev driver logs them.
# DNS_RESOLVER_URL (a var) is the DNS-over-HTTPS JSON resolver domain checks use, Cloudflare's when unset; the e2e sets it.
# The mail provider (src/mailprovider): MAIL_PROVIDER (a var) `mxroute` with MXROUTE_SERVER (a var, e.g. sunfire.mxrouting.net)
# and the secrets MXROUTE_USERNAME and MXROUTE_API_KEY (decision_log 2026-11-08); `opensrs` with the secrets OPENSRS_API_URL,
# OPENSRS_USER and OPENSRS_PASSWORD; or `fake` for local dev and the e2e; unset, the placeholder records and no provider changes.
# MXRoute takes a domain only once `_da-verify-<key>.<domain>` TXT = domain-verified is in DNS: the platform zone gets it
# through CLOUDFLARE_DNS_TOKEN before the domain is made, an organization's own domain shows it in its Domains list.
[vars]
ORIGIN_URL = "https://origin.freeflow.im"
# The hosts the built files are served on. The other hosts' paths are the origin's (the plugin, the 301s to the app).
ASSET_HOSTS = "app.freeflow.im,edge.freeflow.im"
# The hosts the ported API answers on: app.freeflow.im since the cut-over (2026-11-02).
PORTED_HOSTS = "edge.freeflow.im,app.freeflow.im"
WEB_URL_BASE = "https://app.freeflow.im"
# The web-to-app sign-in handoff's return destinations, exact (the server's FLOW_HANDOFF_RETURN_URLS): the Mac, iOS and
# desktop apps' flow://signin, and the web client's own page. None turns the handoff off, and /v1/client-info says so.
FLOW_HANDOFF_RETURN_URLS = "flow://signin,https://app.freeflow.im/"
FLOW_WEB_URL = "https://app.freeflow.im"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "ORG"
class_name = "Org"

[[durable_objects.bindings]]
name = "DOCS"
class_name = "Docs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Directory", "Org"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Docs"]

# OCR of scanned PDFs (src/pdfOcr.ts, containers/pdf-ocr): a Linux container behind each PdfOcr object, which Docs' PDF to
# Markdown calls for the pages pdf.js finds no text on. `wrangler deploy` builds the image with Docker for linux/amd64 and
# pushes it to Cloudflare's registry. standard-1 is 1/2 vCPU, 4 GiB and 8 GB of disk: OCR peaks near 0.5 GiB and reads
# about a page a second on half a vCPU (basic's quarter took four times as long). Billed per 10 ms while awake; PdfOcr
# sleeps 1 minute after its last PDF, and asleep costs nothing. Requests go to one of 3 instances (runtime/pdfOcr.ts).
[[containers]]
class_name = "PdfOcr"
image = "./containers/pdf-ocr/Dockerfile"
instance_type = "standard-1"
max_instances = 3

[[durable_objects.bindings]]
name = "PDF_OCR"
class_name = "PdfOcr"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PdfOcr"]

# FreeFlow Mail (src/imap/object.ts, docs/specs/mail-api.md): one object per person, named by their user id, holding the
# mail accounts they connected (passwords sealed with FLOW_DATA_KEY) and their open IMAP connections. MAIL_ALLOW_INSECURE=1
# (unencrypted connections, any port, local hosts) is for local dev only, given with --var; it is never set here.
# MAIL_ALARM = "off" (a var) stops the prefetch cache's alarm (src/imap/object.ts), a kill switch; pages then check the mail
# server themselves. Used on 2026-11-04 while a slow query (#697) was found.
[[durable_objects.bindings]]
name = "MAIL"
class_name = "Mail"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Mail"]

# FreeFlow Calendar (src/calendar/object.ts, docs/specs/calendar.md): one object per person, named by their user id, holding
# the calendar accounts they connected (passwords sealed with FLOW_DATA_KEY) and a complete copy of their calendars, kept
# fresh by its alarm. CALENDAR_ALLOW_INSECURE=1 (http and local hosts, for Radicale) is for local dev only, given with --var;
# it is never set here. CALENDAR_ALARM = "off" (a var) stops the alarm, a kill switch.
[[durable_objects.bindings]]
name = "CALENDAR"
class_name = "Calendar"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Calendar"]

# The event bus (src/events/object.ts, docs/specs/platform.md §5.2): one object per organization, named by its id, holding
# its append-only event log. The Org object publishes Chat's events into it, the Mail object `mail.received`, the Calendar object `calendar.event.*`; GET
# /v1/events reads it. Its alarm keeps the retention window (30 days, 200,000 rows).
[[durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Events"]

# The assistant (src/assistant/object.ts, docs/specs/platform.md §5.5): one object per account, named by its id, holding the
# account's chats, assistant settings and usage, and running the model loop with the tool registry's tools, against the apps'
# objects as the person. routes/assistant.ts serves Docs' old paths (/api/agent*, /api/settings/assistant) from it. The chats
# were in the organizations' Docs objects until 2026-11-07: POST /v1/admin/assistant/migrate copies them, once, after deploy.
[[durable_objects.bindings]]
name = "ASSISTANT"
class_name = "Assistant"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["Assistant"]

# FreeFlow Contacts (platform.md §11, phase 6.5): one object per account (`idFromName(accountId)`), its own contacts and the
# one grant that shares them with the organization (src/contacts/object.ts). The fifth app, declared by its manifest.
[[durable_objects.bindings]]
name = "CONTACTS"
class_name = "Contacts"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["Contacts"]

# Wake jobs (src/events/object.ts, platform.md §5.2): the Events object sends each job's check to flow-jobs, delayed by
# JOBS_ACK_DELAY_SECONDS (default 60); the Worker's `queue` handler (src/index.ts) asks the Events object, which delivers
# the job again (retry after 120 s × attempts) or parks it after three. A check that keeps throwing ends in flow-jobs-dlq,
# which nothing consumes: look there with `wrangler queues`. Both queues are made once with `wrangler queues create`.
[[queues.producers]]
binding = "JOBS"
queue = "flow-jobs"

[[queues.consumers]]
queue = "flow-jobs"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "flow-jobs-dlq"

# Provisioning (src/provisioning, platform.md §3.4): with a mail provider (MAIL_PROVIDER), the Directory object sends
# each new account here (`requested`), and each removal, rejoin and retention deletion; the consumer makes the mailbox
# and the native calendar (`mailbox_ready`, `calendars_ready`, `active`). A busy provider is retried after 60 s × attempts,
# a refusal stops with the account's status_message and a notice to the admins; past five retries a message goes to
# flow-provisioning-dlq, whose consumer sends the same notice. MAIL_RETENTION_DAYS (a var, default 30) is how long a
# removed account's suspended mailbox is kept before the Org object's daily sweep deletes it. Without MAIL_PROVIDER
# accounts start `active` as before. Both queues are made once: `wrangler queues create flow-provisioning` and
# `wrangler queues create flow-provisioning-dlq`. Local dev with the fake: GREENMAIL_API_URL, GREENMAIL_IMAP_PORT and
# GREENMAIL_SMTP_PORT (vars) point it at a GreenMail with its REST API (test/e2e-provisioning.mjs).
[[queues.producers]]
binding = "PROVISIONING"
queue = "flow-provisioning"

[[queues.consumers]]
queue = "flow-provisioning"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "flow-provisioning-dlq"

[[queues.consumers]]
queue = "flow-provisioning-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "flow-files"

# Cloudflare Images: resizes Chat's link-preview images and attachment thumbnails, and re-encodes them to WebP (which
# drops their metadata), in the Org object (src/org/lib/images.ts). Billed per unique transformation; without the binding,
# or past the free plan's monthly allowance, images are stored as they came. `wrangler dev` runs a local stand-in.
[images]
binding = "IMAGES"

[browser]
binding = "BROWSER"

[observability]
enabled = true
