# The FreeFlow suite on AWS: one EC2 instance running two apps behind Caddy, which serves HTTPS with a certificate
# it gets for each host name and routes by host.
#
# - MCP Docs on the web (the Workspace app, packages/docs/deploy/aws/Dockerfile): container `app`, DomainName and
#   OtherDomains. One process with SQLite and its files on a local disk (DATA_DIR), so it runs as exactly one copy.
# - Flow (the Chat app, packages/server/deploy/aws/Dockerfile): container `flow`, FlowDomainName, with its Postgres
#   and NATS as containers on the same docker network (neither published on a host port).
#
# The data (SQLite, files, Postgres and its nightly dumps, Caddy's certificates) lives on its own EBS volume at
# /data, kept when the stack or instance goes, with a snapshot every day.
#
# Deploys: .github/workflows/docs-aws-deploy.yml and flow-aws-deploy.yml build each image on a push to main, push
# it to its ECR repository below and run /opt/mcpdocs/deploy.sh {docs|flow} <tag> on the instance through Systems
# Manager. Each app's secrets are SecureString parameters, under /mcpdocs/ and /flow/, read on every deploy.
# UserData runs on the instance's first boot only: after a stack update that changes it, run it again on the
# instance. See deploy/aws/README.md and docs/ops/FLOW_TO_AWS.md.
AWSTemplateFormatVersion: '2010-09-09'
Description: FreeFlow on the web, MCP Docs and Flow (single instance)

Parameters:
  DomainName:
    Type: String
    Default: mcpdocs.freeflow.im
  OtherDomains:
    Type: String
    Default: docs.freeflow.im
    Description: More host names served as the app (comma-separated), each with its own certificate
  FlowDomainName:
    Type: String
    Default: app.freeflow.im
    Description: Host name(s) served as Flow (comma-separated), each with its own certificate
  InstanceType:
    Type: String
    Default: t4g.large
    Description: The instance holds both apps, Postgres and NATS
  DataVolumeSizeGiB:
    Type: Number
    Default: 20
  GitHubRepo:
    Type: String
    Default: freeflow-im/mcp-docs
  GitHubRepoIds:
    Type: String
    Default: freeflow-im@309602851/mcp-docs@1431919019
    Description: The repository as GitHub's immutable OIDC subject names it (owner@id/name@id)
  FlowGitHubRepo:
    Type: String
    Default: freeflow-im/flow
    Description: The repository both deploy workflows run from since the docs app moved into it
  FlowGitHubRepoIds:
    Type: String
    Default: freeflow-im@309602851/flow@1305888551
    Description: FlowGitHubRepo as GitHub's immutable OIDC subject names it (owner@id/name@id)
  GitHubOidcProviderArn:
    Type: String
    Description: The account's token.actions.githubusercontent.com OIDC provider
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  UseElasticIp:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: A fixed address; without one the instance keeps its launch address until it is stopped or replaced

Conditions:
  ElasticIp: !Equals [!Ref UseElasticIp, 'true']

Resources:
  # --- Network: a small VPC of its own with one public subnet --------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.80.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: mcpdocs }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: mcpdocs }]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.80.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
      # The instance needs the internet from its first boot (packages, images), before the fixed address is on.
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: mcpdocs }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  # Web traffic only; shell access is through Systems Manager Session Manager, not SSH.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MCP Docs web
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  # --- Images and logs -----------------------------------------------------------------------------------
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mcpdocs
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'
  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /mcpdocs/app
      RetentionInDays: 30
  FlowRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: flow
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'
  FlowLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /flow/app
      RetentionInDays: 30

  # --- The instance --------------------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: mcpdocs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameters]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcpdocs*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/flow*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition: { StringEquals: { 'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com' } }
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource:
                  - !Sub '${AppLogs.Arn}'
                  - !Sub '${FlowLogs.Arn}'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # The data: SQLite databases, files, Flow's Postgres and its dumps, Caddy's certificates. Kept when the stack is
  # deleted or the instance is replaced; DataSnapshots copies it daily.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: mcpdocs-data }
        - { Key: Backup, Value: mcpdocs-data }

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: mcpdocs }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          systemctl enable --now docker

          # Swap, for the build and test runs of app-change jobs on top of the app and Chromium.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=4096
            chmod 600 /swapfile
            mkswap /swapfile
            echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          fi
          swapon -a

          # The data volume, attached after the instance starts: format it the first time, mount it at /data.
          VOL=${DataVolume}
          DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${!VOL/-/}
          for i in $(seq 1 120); do [ -e "$DEV" ] && break; sleep 5; done
          blkid "$DEV" || mkfs.ext4 -L mcpdocs-data "$DEV"
          mkdir -p /data
          grep -q 'LABEL=mcpdocs-data' /etc/fstab || echo 'LABEL=mcpdocs-data /data ext4 defaults,nofail 0 2' >> /etc/fstab
          mount -a
          mkdir -p /data/app /data/caddy /data/postgres /data/backups/postgres

          mkdir -p /opt/mcpdocs
          # Routed by host (WebSockets pass through reverse_proxy as is): Flow's host to `flow`; the Workspace app's hosts to
          # `app`, the docs app in its own container, until the marker /data/workspace-on-suite exists (workspace-to-suite.sh
          # below), then to `flow` too, which serves the Workspace app itself. A running Caddy picks up the new file.
          cat > /opt/mcpdocs/caddyfile.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          WORKSPACE_UPSTREAM=app:3001
          [ -e /data/workspace-on-suite ] && WORKSPACE_UPSTREAM=flow:8787
          cat > /opt/mcpdocs/Caddyfile <<CADDY
          ${DomainName}, ${OtherDomains} {
            reverse_proxy $WORKSPACE_UPSTREAM
          }

          ${FlowDomainName} {
            reverse_proxy flow:8787
          }
          CADDY
          if docker inspect caddy >/dev/null 2>&1; then docker exec caddy caddy reload --config /etc/caddy/Caddyfile || true; fi
          EOF
          chmod 755 /opt/mcpdocs/caddyfile.sh
          /opt/mcpdocs/caddyfile.sh

          cat > /opt/mcpdocs/deploy.sh <<'EOF'
          #!/bin/bash
          # Runs one app's image with the given tag (the commit), replacing its running container:
          #   deploy.sh docs <tag>   the docs app (MCP Docs): container `app`, secrets under /mcpdocs/
          #   deploy.sh flow <tag>   Flow: container `flow`, secrets under /flow/, with the `postgres` and `nats` containers
          #   deploy.sh <tag>        the same as `docs <tag>` (the form the first version of this script took)
          #   deploy.sh services     only Caddy, Postgres and NATS, each started if it is not there
          # Called by the deploy workflows through Systems Manager; run by hand with no tag to restart the latest image.
          set -euo pipefail
          # One deploy at a time: the two workflows can run together, and each prunes images the other may be about to run.
          exec 9>/opt/mcpdocs/deploy.lock
          flock 9
          case "${!1:-}" in
            docs|flow|services) APP=$1; TAG=${!2:-latest} ;;
            *) APP=docs; TAG=${!1:-latest} ;;
          esac
          REGION=${AWS::Region}
          REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          umask 077

          # Every parameter under a path, named for its variable: NAME=value lines.
          params() {
            aws ssm get-parameters-by-path --region $REGION --path "$1" --recursive --with-decryption \
              --query 'Parameters[].[Name,Value]' --output text | sed -e "s#^$1##" -e 's#\t#=#'
          }

          pull() {
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
            # Only the running images are kept: the disk holds the running images, not a week of them. An older one is
            # pulled again from the registry to roll back.
            docker image prune -af >/dev/null || true
            docker pull $1
          }

          network() {
            docker network inspect mcpdocs >/dev/null 2>&1 || docker network create mcpdocs
          }

          caddy() {
            if ! docker inspect caddy >/dev/null 2>&1; then
              docker run -d --name caddy --network mcpdocs --restart unless-stopped \
                -p 80:80 -p 443:443 -p 443:443/udp \
                -v /opt/mcpdocs/Caddyfile:/etc/caddy/Caddyfile:ro -v /data/caddy:/data caddy:2.10.2
            fi
          }

          # Flow's Postgres and NATS, started once and then kept running by Docker (also across reboots). Postgres's data is
          # on the data volume; its superuser password, /flow/POSTGRES_PASSWORD, is set when the data directory is created.
          # Upgrading either image: docker stop <name> && docker rm <name>, then deploy.sh services.
          services() {
            network
            if ! docker inspect postgres >/dev/null 2>&1; then
              if params /flow/ | grep '^POSTGRES_PASSWORD=' > /opt/mcpdocs/postgres.env; then
                docker run -d --name postgres --network mcpdocs --restart unless-stopped --stop-timeout 120 --shm-size 256m \
                  -v /data/postgres:/var/lib/postgresql/data --env-file /opt/mcpdocs/postgres.env \
                  -e POSTGRES_USER=flow -e POSTGRES_DB=flow --log-opt max-size=10m --log-opt max-file=3 postgres:17-bookworm
              else
                echo 'no /flow/POSTGRES_PASSWORD yet: Postgres is not started'
              fi
            fi
            if ! docker inspect nats >/dev/null 2>&1; then
              # Core NATS only: no JetStream, no cluster, no monitoring port.
              docker run -d --name nats --network mcpdocs --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=3 nats:2.10-alpine -p 4222
            fi
            docker inspect postgres >/dev/null 2>&1 || return 0
            for i in $(seq 1 60); do docker exec postgres pg_isready -q -U flow -d flow && return 0; sleep 2; done
            echo 'postgres is not ready'; return 1
          }

          healthy() {
            [ "$(docker inspect -f '{{.State.Health.Status}}' $1 2>/dev/null)" = healthy ]
          }

          finish() {
            for i in $(seq 1 60); do healthy $1 && { echo "deployed $APP $TAG"; break; }; sleep 5; done
            docker image prune -af >/dev/null || true
            healthy $1 || { echo "$1 is not healthy"; docker logs --tail 50 $1 || true; exit 1; }
          }

          deploy_docs() {
            # Once the Workspace app is on the suite (workspace-to-suite.sh), the docs app's own container is retired.
            [ -e /data/workspace-on-suite ] && { echo 'the Workspace app is served by the suite now; nothing to deploy'; exit 0; }
            IMAGE=$REGISTRY/${Repository}:$TAG
            pull $IMAGE
            # The app's secrets: every parameter under /mcpdocs/.
            params /mcpdocs/ > /opt/mcpdocs/app.env
            network
            docker rm -f app >/dev/null 2>&1 || true
            docker run -d --name app --network mcpdocs --restart unless-stopped --stop-timeout 30 \
              -v /data/app:/data --env-file /opt/mcpdocs/app.env \
              -e APP_URL=https://${DomainName} -e SECURE_COOKIES=1 -e GITHUB_REPO=${GitHubRepo} \
              --log-driver awslogs --log-opt awslogs-region=$REGION --log-opt awslogs-group=${AppLogs} \
              $IMAGE
            caddy
            finish app
          }

          deploy_flow() {
            IMAGE=$REGISTRY/${FlowRepository}:$TAG
            # Flow's secrets: every parameter under /flow/ but Postgres's password, which goes into DATABASE_URL instead.
            params /flow/ > /opt/mcpdocs/flow.params
            grep -v '^POSTGRES_PASSWORD=' /opt/mcpdocs/flow.params > /opt/mcpdocs/flow.env || true
            # The database and NATS on this box, unless a parameter names others (/flow/DATABASE_URL for RDS, say). The
            # password goes into the URL as it is, so it is made of URL-safe characters (openssl rand -hex 32).
            if ! grep -q '^DATABASE_URL=' /opt/mcpdocs/flow.env; then
              PW=$(sed -n 's/^POSTGRES_PASSWORD=//p' /opt/mcpdocs/flow.params)
              [ -n "$PW" ] || { rm -f /opt/mcpdocs/flow.params; echo 'set /flow/POSTGRES_PASSWORD first'; exit 1; }
              echo "DATABASE_URL=postgres://flow:$PW@postgres:5432/flow" >> /opt/mcpdocs/flow.env
            fi
            grep -q '^NATS_URL=' /opt/mcpdocs/flow.env || echo 'NATS_URL=nats://nats:4222' >> /opt/mcpdocs/flow.env
            rm -f /opt/mcpdocs/flow.params
            # The Workspace app inside the suite, once workspace-to-suite.sh has moved it: the docs app's data directory
            # (/data/app) mounted at /data/workspace, its settings from /mcpdocs/ (all but the docs app's own sign-in and
            # mail, which the suite does now), the ChatGPT plugin at the old host names, and those names sent to /workspace.
            WORKSPACE_MOUNT=()
            if [ -e /data/workspace-on-suite ]; then
              params /mcpdocs/ | grep -vE '^(GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|CLOUDFLARE_ACCOUNT_ID|CLOUDFLARE_API_TOKEN|MAIL_FROM|PLUGIN_ENABLED|APP_URL|SECURE_COOKIES)=' \
                | sed 's/^PLUGIN_PUBLIC_URL=/WORKSPACE_PLUGIN_URL=/' >> /opt/mcpdocs/flow.env
              printf 'WORKSPACE_DATA_DIR=/data/workspace\nWORKSPACE_LEGACY_HOSTS=${DomainName},${OtherDomains}\n' >> /opt/mcpdocs/flow.env
              # The image runs as `node` (uid 1000); the docs app's container ran as root.
              mkdir -p /data/app && chown -R 1000:1000 /data/app
              WORKSPACE_MOUNT=(-v /data/app:/data/workspace)
            fi
            services
            pull $IMAGE
            # docker stop, not rm -f: the server gets SIGTERM and up to a minute to drain (sockets, in-flight requests).
            if docker inspect flow >/dev/null 2>&1; then
              docker stop -t 60 flow >/dev/null || true
              docker rm -f flow >/dev/null 2>&1 || true
            fi
            # The image runs as `node` (uid 1000); /data/flow is where it may write.
          mkdir -p /data/flow && chown 1000:1000 /data/flow
          docker run -d --name flow --network mcpdocs --restart unless-stopped --stop-timeout 60 \
              -v /data/flow:/data "${!WORKSPACE_MOUNT[@]}" --env-file /opt/mcpdocs/flow.env -e HOST=0.0.0.0 -e PORT=8787 \
              --log-driver awslogs --log-opt awslogs-region=$REGION --log-opt awslogs-group=${FlowLogs} \
              $IMAGE
            caddy
            finish flow
          }

          case $APP in
            docs) deploy_docs ;;
            flow) deploy_flow ;;
            services) services; caddy ;;
          esac
          EOF
          chmod 755 /opt/mcpdocs/deploy.sh

          # FreeFlow phase 2 (docs/ops/WORKSPACE_TO_SUITE.md): the Workspace app moves from its own container into the suite's.
          # Stops the docs app, marks the move on the data volume, deploys the suite with the Workspace app on, imports the
          # docs app's accounts into the suite's, and routes the old host names to the suite. Run again to retry; `undo`
          # puts the docs app back in its own container (the accounts imported stay).
          cat > /opt/mcpdocs/workspace-to-suite.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          if [ "${!1:-}" = undo ]; then
            rm -f /data/workspace-on-suite
            /opt/mcpdocs/deploy.sh flow latest
            /opt/mcpdocs/deploy.sh docs latest
            /opt/mcpdocs/caddyfile.sh
            echo 'the Workspace app is back in its own container'
            exit 0
          fi
          docker stop -t 30 app >/dev/null 2>&1 || true
          docker rm -f app >/dev/null 2>&1 || true
          touch /data/workspace-on-suite
          /opt/mcpdocs/deploy.sh flow latest
          docker exec flow node packages/server/scripts/import-workspace-users.ts /data/workspace --apply
          /opt/mcpdocs/caddyfile.sh
          echo 'the Workspace app is on the suite'
          EOF
          chmod 755 /opt/mcpdocs/workspace-to-suite.sh

          # Nightly: a plain SQL dump of Flow's database on the data volume, the newest 14 kept. The volume's snapshots
          # copy the files; a dump is what a fresh Postgres (RDS, a new major version) is restored from:
          #   gunzip -c <file> | docker exec -i postgres psql -U flow -d flow
          cat > /opt/mcpdocs/pg-backup.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          docker inspect postgres >/dev/null 2>&1 || exit 0
          DIR=/data/backups/postgres
          mkdir -p $DIR
          OUT=$DIR/$(date -u +%F).sql.gz
          docker exec postgres pg_dump -U flow -d flow | gzip > $OUT.tmp
          mv $OUT.tmp $OUT
          ls -1 $DIR/*.sql.gz | sort | head -n -14 | xargs -r rm -f --
          EOF
          chmod 700 /opt/mcpdocs/pg-backup.sh
          # A systemd timer rather than cron, which Amazon Linux 2023 does not install; before the 10:00 UTC snapshot.
          cat > /etc/systemd/system/flow-pg-backup.service <<'EOF'
          [Unit]
          Description=Dump Flow's Postgres to /data/backups/postgres
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/opt/mcpdocs/pg-backup.sh
          EOF
          cat > /etc/systemd/system/flow-pg-backup.timer <<'EOF'
          [Unit]
          Description=Nightly dump of Flow's Postgres

          [Timer]
          OnCalendar=*-*-* 09:30:00 UTC
          Persistent=true

          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now flow-pg-backup.timer

          # Start what is already in the registry (nothing before the first deploys).
          /opt/mcpdocs/deploy.sh docs latest || echo 'no image yet; the first deploy starts the app'
          /opt/mcpdocs/deploy.sh flow latest || echo 'no Flow image or /flow/ parameters yet; the first Flow deploy starts it'

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  # A fixed address for the domain's A record.
  Address:
    Type: AWS::EC2::EIP
    Condition: ElasticIp
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: mcpdocs }]

  # --- Daily snapshots of the data volume, kept 14 days ---------------------------------------------------
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: dlm.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole]
  DataSnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: MCP Docs data daily
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: Backup, Value: mcpdocs-data }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ['10:00'] }
            RetainRule: { Count: 14 }
            CopyTags: true

  # --- What the deploy workflow may do: push images and run deploy.sh ------------------------------------
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mcpdocs-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProviderArn }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub's subject names the repository either way: with its owner's and its own ids when the
                # repository uses immutable subjects (GitHubRepoIds; `gh api repos/<repo>/actions/oidc/customization/sub`).
                # FlowGitHubRepo is where both deploy workflows run now; GitHubRepo is the docs app's old repository.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepoIds}:ref:refs/heads/main
                  - !Sub repo:${FlowGitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${FlowGitHubRepoIds}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !GetAtt Repository.Arn
                  - !GetAtt FlowRepository.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - { Effect: Allow, Action: ssm:GetCommandInvocation, Resource: '*' }

Outputs:
  PublicIp:
    Description: Point the domain's A record here
    Value: !If [ElasticIp, !Ref Address, !GetAtt Instance.PublicIp]
  InstanceId:
    Value: !Ref Instance
  RepositoryUri:
    Description: The docs app's images (the repository variable AWS_ECR_REPOSITORY)
    Value: !GetAtt Repository.RepositoryUri
  FlowRepositoryUri:
    Description: Flow's images (the repository variable AWS_FLOW_ECR_REPOSITORY)
    Value: !GetAtt FlowRepository.RepositoryUri
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  DataVolumeId:
    Value: !Ref DataVolume
