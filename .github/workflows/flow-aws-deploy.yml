# Deploys the suite's server (packages/server, serving packages/web/dist, with the Workspace app of packages/docs
# inside it: src/workspace.ts) to the AWS stack (packages/docs/deploy/aws/template.yaml) on each push to main that touches what goes into its image: builds
# packages/server/deploy/aws/Dockerfile from the repository root on an Arm runner (the instance is Graviton), pushes
# it to the stack's `flow` ECR repository and runs `deploy.sh flow <sha>` on the instance through Systems Manager.
# Does nothing until the repository variables AWS_DEPLOY_ROLE_ARN, AWS_INSTANCE_ID and AWS_FLOW_ECR_REPOSITORY are
# set (the stack's outputs; docs/ops/FLOW_TO_AWS.md). A change to changelog/ alone does not deploy: "What's New"
# picks it up with the next server deploy.
#
# The clients are built once (build-clients.yml) and both deploys take that artifact: the edge Worker deploys as soon as
# they are built, without waiting for the image and the instance (minutes), and the image takes the same files.
name: Flow AWS deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/suite-bar/**'
      - 'packages/edge/scripts/clients.mjs'
      # The clients, from the manifests (a static filter cannot run a script; the edge tests check this block).
      # clients:paths begin (node packages/edge/scripts/clients.mjs write)
      - 'packages/web/**'
      - 'packages/docs/**'
      - 'packages/mail/**'
      - 'packages/calendar/**'
      - 'packages/home/**'
      - 'packages/contacts/**'
      - 'packages/admin/**'
      # clients:paths end
      - 'docs/help/**'
      - 'scripts/build-features.mjs'
      - '.claude/skills/flow-agent-member/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/flow-aws-deploy.yml'
      - '.github/workflows/build-clients.yml'
  workflow_dispatch:

concurrency: flow-aws-deploy

jobs:
  clients:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_FLOW_ECR_REPOSITORY != ''
    uses: ./.github/workflows/build-clients.yml
    permissions:
      contents: read

  deploy:
    needs: clients
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # assumes the deploy role
    env:
      AWS_REGION: us-west-2
      IMAGE: ${{ vars.AWS_FLOW_ECR_REPOSITORY }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - uses: aws-actions/amazon-ecr-login@v2

      # The clients built once for this commit; the image takes them instead of building its own (Dockerfile `prebuilt`).
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.clients.outputs.artifact }}
          path: ${{ runner.temp }}/prebuilt

      - name: Build and push the image
        run: |
          docker build -f packages/server/deploy/aws/Dockerfile --build-arg GIT_COMMIT_SHA=${{ github.sha }} --build-context prebuilt="$RUNNER_TEMP/prebuilt" -t "$IMAGE" -t "${{ vars.AWS_FLOW_ECR_REPOSITORY }}:latest" .
          docker push "$IMAGE"
          docker push "${{ vars.AWS_FLOW_ECR_REPOSITORY }}:latest"

      - name: Run it on the instance
        env:
          INSTANCE: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --parameters "commands=['/opt/mcpdocs/deploy.sh flow ${{ github.sha }}']" --timeout-seconds 600 \
            --query Command.CommandId --output text)
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$status" = Success ]

  # The Worker deploys the same clients as soon as they are built, beside the image's build, not after it: they have the
  # names the server's pages use. A file it does not have yet is answered by the origin, so a failure here costs speed
  # and no availability.
  edge:
    needs: clients
    if: vars.EDGE_DEPLOY == 'true'
    uses: ./.github/workflows/deploy-edge.yml
    with:
      clients_artifact: ${{ needs.clients.outputs.artifact }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
