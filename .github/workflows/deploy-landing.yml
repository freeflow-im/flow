# Deploy the Flow marketing site (flowlandingpage/) to Cloudflare Pages. Runs on
# any push to main that touches the site. The site is a static Next.js export
# (`out/`) — no server, so Pages just serves files.
#
# One-time Cloudflare setup (see BUILD.md):
#   - Pages project "freeflow-landing", custom domain flow.freeflow.im
#     (freeflow.im itself is the home page: see deploy-home.yml)
#   - Repo secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit),
#     CLOUDFLARE_ACCOUNT_ID
name: deploy-landing

on:
  push:
    branches: [main]
    paths:
      - 'flowlandingpage/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      # --ignore-workspace: the site is standalone, not part of the repo's
      # pnpm workspace (packages/*); the flag keeps its lockfile local.
      - name: Install
        working-directory: flowlandingpage
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Build (static export)
        working-directory: flowlandingpage
        run: pnpm build

      # Plain npx, not cloudflare/wrangler-action: the action installs wrangler
      # with pnpm at the repo root, which the pnpm workspace refuses.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy flowlandingpage/out --project-name=freeflow-landing --branch=main
