# Deploys the suite's Cloudflare Worker (packages/edge): after each deploy of the server (flow-aws-deploy.yml calls this),
# and on a change to the Worker alone, which needs no restart of the server. Its files are copied out of the server's
# image, never built again: a separate build gives files different names, and then the Worker has none of what the
# pages ask for.
#
# Does nothing until the repository variable EDGE_DEPLOY is `true` (docs/ops/EDGE_FRONT_DOOR.md). Secrets:
# CLOUDFLARE_EDGE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy-edge

on:
  push:
    branches: [main]
    paths:
      - 'packages/edge/**'
      - '.github/workflows/deploy-edge.yml'
  workflow_dispatch:
  workflow_call:

concurrency: deploy-edge

jobs:
  deploy:
    if: vars.EDGE_DEPLOY == 'true' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm # the image is Arm
    permissions:
      contents: read
      id-token: write # assumes the deploy role, to pull the image
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/docs/.node-version
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Copy the clients out of the server's image
        env:
          IMAGE: ${{ vars.AWS_FLOW_ECR_REPOSITORY }}:latest
        run: |
          docker pull "$IMAGE"
          id=$(docker create "$IMAGE")
          mkdir -p packages/web packages/docs/dist
          docker cp "$id:/app/packages/web/dist" packages/web/dist
          docker cp "$id:/app/packages/docs/dist/client" packages/docs/dist/client
          docker rm "$id"
      - name: Install
        run: pnpm install --frozen-lockfile --filter @flow/edge...
      - name: Assemble and deploy
        working-directory: packages/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/assemble.mjs
          pnpm exec wrangler deploy
