# Deploys the suite's Cloudflare Worker (packages/edge): after each deploy of the server (flow-aws-deploy.yml calls this),
# and on a change to the Worker alone, which needs no restart of the server. Its files are copied out of the server's
# image, never built again: a separate build gives files different names, and then the Worker has none of what the
# pages ask for.
#
# Does nothing until the repository variable EDGE_DEPLOY is `true` (docs/ops/EDGE_FRONT_DOOR.md). Secrets:
# CLOUDFLARE_EDGE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# `wrangler deploy` also builds the PDF OCR container (packages/edge/containers/pdf-ocr, wrangler.toml [[containers]]) with
# this runner's Docker and pushes it to Cloudflare's registry. Cloudflare runs linux/amd64 only; the Dockerfile installs on
# the builder's platform and its amd64 stage has no RUN step, so this Arm runner needs no QEMU. Containers need the
# Workers Paid plan; if the push of the image is refused, the token lacks the account's Containers permission (Edit).
name: deploy-edge

on:
  push:
    branches: [main]
    paths:
      - 'packages/edge/**'
      - '.github/workflows/deploy-edge.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      clients_artifact:
        description: The clients built for this commit (build-clients.yml); without it they are copied out of the server's latest image.
        type: string
        default: ''

concurrency: deploy-edge

jobs:
  # A push that flow-aws-deploy.yml deploys too (it touches a client, the server or what they share) is left to that run,
  # which deploys this Worker with the clients built for the commit: this run would copy the clients out of the server's
  # image, which may not be rebuilt yet, and put back the old ones. Called or run by hand, it always goes.
  gate:
    runs-on: ubuntu-24.04-arm
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != push ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(packages/(server|shared|suite-bar|web|docs|mail|calendar|home|contacts|admin)/|packages/edge/scripts/clients\.mjs$|docs/help/|scripts/build-features\.mjs$|\.claude/skills/flow-agent-member/|package\.json$|tsconfig\.base\.json$|pnpm-(lock|workspace)\.yaml$|\.github/workflows/(flow-aws-deploy|build-clients)\.yml$)'; then
            echo "flow-aws-deploy.yml deploys this commit, with its own clients"; echo go=false >> "$GITHUB_OUTPUT"
          else echo go=true >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true' && vars.EDGE_DEPLOY == 'true' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm # the image is Arm
    permissions:
      contents: read
      id-token: write # assumes the deploy role, to pull the image
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/docs/.node-version
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Install
        run: pnpm install --frozen-lockfile --filter @flow/edge...
      - name: Build the shared types and schemas
        run: pnpm --filter @flow/shared build
      - name: Take the clients built for this commit
        if: inputs.clients_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.clients_artifact }}
          path: .
      - name: Copy the clients out of the server's image
        if: inputs.clients_artifact == ''
        env:
          IMAGE: ${{ vars.AWS_FLOW_ECR_REPOSITORY }}:latest
        run: |
          docker pull "$IMAGE"
          id=$(docker create "$IMAGE")
          # One per manifest client (scripts/clients.mjs). An optional one is missing from an image built before its
          # app was added, and assemble.mjs then leaves its path out.
          node packages/edge/scripts/clients.mjs dists | while read -r dist need; do
            mkdir -p "$(dirname "$dist")"
            if [ "$need" = required ]; then docker cp "$id:/app/$dist" "$dist"
            else docker cp "$id:/app/$dist" "$dist" || echo "no $dist in this image"; fi
          done
          docker rm "$id"
      - name: Assemble and deploy
        working-directory: packages/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EDGE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/assemble.mjs
          docker buildx version
          pnpm exec wrangler deploy
